name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (.NET + MongoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore MyMusic.sln
      - run: dotnet build MyMusic.sln --no-restore --configuration Release

      # Integration tests start MongoDB 8 with Testcontainers on the runner's Docker.
      - run: dotnet test MyMusic.sln --no-build --configuration Release --verbosity normal

  worker:
    name: Edge Worker (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy (Cloudflare Workers + Containers)
    needs: [api, worker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Builds the Dockerfile, pushes it to Cloudflare's registry and deploys
      # the Worker and container together.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            MONGODB_URI
            JWT_KEY
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_KEY: ${{ secrets.JWT_KEY }}

      # The first request cold-starts the container; allow time before failing.
      - name: Smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$DEPLOYMENT_URL/health" | grep -q Healthy
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/Artist" > /dev/null
          code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST "$DEPLOYMENT_URL/api/Artist" -H 'content-type: application/json' -d '{"name":"smoke"}')"
          test "$code" = 401 || { echo "expected 401 for anonymous write, got $code"; exit 1; }
